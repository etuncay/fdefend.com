# fdefend.com — nginx site config
# Kopyala: /etc/nginx/sites-available/fdefend.com

server {
    listen 80;
    listen [::]:80;
    server_name fdefend.com www.fdefend.com;

    root /home/sites/fdefend.com;
    index index.html;

    access_log /var/log/nginx/fdefend.com.access.log;
    error_log /var/log/nginx/fdefend.com.error.log warn;

    # Güvenlik başlıkları
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Statik varlıklar — uzun cache
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /robots.txt {
        try_files $uri =404;
        expires 1d;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        expires 1d;
        default_type application/xml;
    }

    location = /site.webmanifest {
        try_files $uri =404;
        expires 7d;
        default_type application/manifest+json;
    }

    # SPA fallback — tüm route'lar index.html'e düşer
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gizli dosyalar
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

